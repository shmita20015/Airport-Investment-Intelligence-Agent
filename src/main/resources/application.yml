spring:
  application:
    name: airport-investment-agent
  ai:
    google:
      genai:
        # Set the key in the environment variable GEMINI_API_KEY. Never write it in this file.
        # Spring AI refuses to start with an empty key. The value not-set lets the REST API start without a key.
        # The chat then answers with a message and makes no call (ChatService.NO_KEY).
        api-key: ${GEMINI_API_KEY:not-set}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-3.8-flash}

airport:
  scoring:
    # Heuristic start weights. They are not fitted to data. Each profile must add up to 1.0.
    profiles:
      terminal:
        congestion: 0.25
        growth: 0.20
        load_factor: 0.15
        terminal_strain: 0.15
        long_haul: 0.10
        scale: 0.15
      general:
        congestion: 0.35
        growth: 0.25
        load_factor: 0.25
        scale: 0.15
    # Unmet demand is a proxy index. See docs/DESIGN-full.md, section 6.8.
    unmet-demand:
      load_factor: 0.40
      growth: 0.30
      congestion: 0.30
    # Airports below this size are not ranked (enplanements a year).
    min-enplanements: 100000
    # Airports with fewer On-Time flights a year have no delay KPIs.
    min-ontime-flights: 1000
    # Default distance limit of the long-haul share, in statute miles.
    default-long-haul-miles: 2500
    # Regions for the ranking filter. A region is a list of state codes. The user can also give a state code
    # (for example TX) or a comma list (for example CA,OR,WA). The percentiles stay national.
    # The first group follows the US Census Bureau (4 regions and 9 divisions). The second group is informal.
    regions:
      NORTHEAST: [CT, ME, MA, NH, RI, VT, NJ, NY, PA]
      MIDWEST: [IL, IN, MI, OH, WI, IA, KS, MN, MO, NE, ND, SD]
      SOUTH: [DE, DC, FL, GA, MD, NC, SC, VA, WV, AL, KY, MS, TN, AR, LA, OK, TX]
      WEST: [AZ, CO, ID, MT, NV, NM, UT, WY, AK, CA, HI, OR, WA]
      NEW_ENGLAND: [CT, ME, MA, NH, RI, VT]
      MID_ATLANTIC: [NJ, NY, PA]
      EAST_NORTH_CENTRAL: [IL, IN, MI, OH, WI]
      WEST_NORTH_CENTRAL: [IA, KS, MN, MO, NE, ND, SD]
      SOUTH_ATLANTIC: [DE, DC, FL, GA, MD, NC, SC, VA, WV]
      EAST_SOUTH_CENTRAL: [AL, KY, MS, TN]
      WEST_SOUTH_CENTRAL: [AR, LA, OK, TX]
      MOUNTAIN: [AZ, CO, ID, MT, NV, NM, UT, WY]
      PACIFIC: [AK, CA, HI, OR, WA]
      WEST_COAST: [CA, OR, WA]
      PACIFIC_NORTHWEST: [OR, WA, ID]
      SOUTHWEST: [AZ, NM, TX, OK]
      SOUTHEAST: [AL, AR, FL, GA, KY, LA, MS, NC, SC, TN, VA, WV]
      GREAT_LAKES: [IL, IN, MI, MN, NY, OH, PA, WI]
      GREAT_PLAINS: [KS, NE, ND, OK, SD]
      ROCKY_MOUNTAIN: [CO, ID, MT, UT, WY]
      GULF_COAST: [AL, FL, LA, MS, TX]
      LOWER_48: [AL, AR, AZ, CA, CO, CT, DC, DE, FL, GA, IA, ID, IL, IN, KS, KY, LA, MA, MD, ME, MI, MN, MO, MS, MT, NC, ND, NE, NH, NJ, NM, NV, NY, OH, OK, OR, PA, RI, SC, SD, TN, TX, UT, VA, VT, WA, WI, WV, WY]
      TERRITORIES: [PR, VI, GU, MP, AS]

  # Notes from general knowledge. They are never inputs of a score. A result labels them as expert notes.
  notes:
    SFO:
      text: >-
        SFO has parallel runways that are close to each other. In low visibility they cannot work as independent
        runways, so the real capacity is lower than the number of runways suggests. The operations per runway KPI
        does not show this.
      source: >-
        Known airfield layout and FAA rules for close parallel runways. This is an expert note. It is not calculated
        from the data files. Check it with the FAA before you use it.

  live:
    # The live FAA call. It shows the current delay status. It is not a score input.
    faa-status-url: https://nasstatus.faa.gov/api/airport-status-information
    timeout-ms: 3000
    # The FAA answer is kept for this time. Many questions in this time make one call to the FAA.
    cache-seconds: 30

  limits:
    # A chat request calls the LLM, so its limit is low. The limits are for one client address.
    chat-requests-per-minute: 10
    api-requests-per-minute: 120
    # Chat requests that run at the same time in the whole app. More requests get HTTP 503.
    max-concurrent-chats: 4
    max-request-bytes: 4096
    max-sessions: 200
    session-idle-minutes: 60
