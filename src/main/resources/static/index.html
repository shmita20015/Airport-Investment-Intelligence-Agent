<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airport Investment Intelligence Agent</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1b1f24; --muted:#5b6672; --accent:#0b5cad; --user:#e3effb; --warn:#8a5a00; --line:#d9dee4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14181d; --card:#1d232a; --text:#e8ecf0; --muted:#9aa6b2; --accent:#5aa9f0; --user:#21384f; --warn:#e0b050; --line:#323b45; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:820px; margin:0 auto; padding:16px; display:flex; flex-direction:column; min-height:100vh; }
  h1 { font-size:1.25rem; margin:0 0 4px; }
  p.sub { margin:0 0 12px; color:var(--muted); font-size:.9rem; }
  #log { flex:1; display:flex; flex-direction:column; gap:10px; padding-bottom:12px; }
  .msg { padding:10px 14px; border-radius:12px; background:var(--card); border:1px solid var(--line); white-space:pre-wrap; overflow-wrap:anywhere; }
  .msg.user { background:var(--user); align-self:flex-end; max-width:85%; }
  .meta { font-size:.8rem; color:var(--muted); margin-top:6px; }
  .meta.warn { color:var(--warn); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .chips button { font:inherit; font-size:.85rem; padding:6px 10px; border-radius:16px; border:1px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; }
  form { display:flex; gap:8px; position:sticky; bottom:0; background:var(--bg); padding:8px 0 12px; }
  input[type=text] { flex:1; font:inherit; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); min-width:0; }
  button.main { font:inherit; padding:10px 14px; border-radius:10px; border:0; background:var(--accent); color:#fff; cursor:pointer; }
  button.icon { font:inherit; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; }
  button.listening { outline:2px solid var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  label.speak { display:flex; align-items:center; gap:6px; font-size:.85rem; color:var(--muted); margin-bottom:8px; }
</style>
</head>
<body>
<main>
  <h1>Airport Investment Intelligence Agent</h1>
  <p class="sub">US commercial airports. The numbers come from public data (BTS, FAA). The scores are screening indexes, not investment advice.</p>

  <div class="chips" id="chips"></div>
  <label class="speak"><input type="checkbox" id="speak"> Read the answers aloud</label>
  <div id="log" aria-live="polite"></div>

  <form id="form">
    <input type="text" id="text" placeholder="Ask a question about US airports" autocomplete="off" maxlength="1000">
    <button type="button" class="icon" id="mic" title="Speak your question" aria-label="Speak your question">Mic</button>
    <button type="submit" class="main" id="send">Send</button>
  </form>
</main>

<script>
(function () {
  var examples = [
    "Which New England airports are strong candidates for terminal expansion?",
    "Compare LAX and SNA congestion.",
    "What is the percentage of long-haul flights out of Anchorage?",
    "What is the unmet flight demand at SFO and why?"
  ];
  var log = document.getElementById("log");
  var form = document.getElementById("form");
  var input = document.getElementById("text");
  var send = document.getElementById("send");
  var mic = document.getElementById("mic");
  var speak = document.getElementById("speak");
  var sessionId = null;
  try { sessionId = sessionStorage.getItem("sessionId"); } catch (e) {}

  examples.forEach(function (q) {
    var b = document.createElement("button");
    b.type = "button"; b.textContent = q;
    b.onclick = function () { ask(q); };
    document.getElementById("chips").appendChild(b);
  });

  function add(kind, text, meta, warn) {
    var div = document.createElement("div");
    div.className = "msg " + kind;
    div.textContent = text;
    if (meta) {
      var m = document.createElement("div");
      m.className = "meta" + (warn ? " warn" : "");
      m.textContent = meta;
      div.appendChild(m);
    }
    log.appendChild(div);
    div.scrollIntoView({ block: "end" });
    return div;
  }

  async function ask(question) {
    question = question.trim();
    if (!question) return;
    add("user", question);
    input.value = "";
    send.disabled = true;
    var waiting = add("bot", "Working...");
    try {
      var res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId: sessionId, message: question })
      });
      var body = await res.json();
      waiting.remove();
      if (!res.ok) { add("bot", body.error || "The request failed.", null, true); return; }
      sessionId = body.sessionId;
      try { sessionStorage.setItem("sessionId", sessionId); } catch (e) {}
      var tools = body.toolsUsed && body.toolsUsed.length ? "Tools: " + body.toolsUsed.join(", ") : "No tool used";
      var check = body.verified ? "Numbers checked against the tool results." : "The numbers could not be checked.";
      add("bot", body.reply, tools + ". " + check, !body.verified);
      if (speak.checked && window.speechSynthesis) {
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(body.reply));
      }
    } catch (e) {
      waiting.remove();
      add("bot", "The server is not reachable.", null, true);
    } finally {
      send.disabled = false;
      input.focus();
    }
  }

  form.addEventListener("submit", function (e) { e.preventDefault(); ask(input.value); });

  // Voice input uses the speech recognition of the browser. Chrome and Edge support it.
  var Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Recognition) {
    mic.disabled = true;
    mic.title = "Voice input is not supported in this browser. Use Chrome or Edge.";
  } else {
    var recognition = new Recognition();
    recognition.lang = "en-US";
    recognition.interimResults = false;
    recognition.onresult = function (event) { ask(event.results[0][0].transcript); };
    recognition.onend = function () { mic.classList.remove("listening"); };
    recognition.onerror = function (event) {
      mic.classList.remove("listening");
      add("bot", "Voice input failed: " + event.error + ". You can type the question.", null, true);
    };
    mic.onclick = function () {
      if (mic.classList.contains("listening")) { recognition.stop(); return; }
      mic.classList.add("listening");
      recognition.start();
    };
  }
  if (!window.speechSynthesis) { speak.parentElement.style.display = "none"; }
})();
</script>
</body>
</html>
